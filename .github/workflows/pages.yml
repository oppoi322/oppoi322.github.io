name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          TZ: Asia/Shanghai
        run: |
          pnpm exec hexo clean
          pnpm exec hexo generate

      # Guardrail: stop the workflow before deploying if the generated site is broken/empty.
      # This prevents cases where `public/index.html` becomes 0 bytes (white page online).
      - name: Validate build output
        shell: bash
        run: |
          set -euo pipefail

          test -d public
          test -s public/index.html

          # Basic sanity: make sure it's real HTML, not an empty/partial file.
          grep -qi "<html" public/index.html

          echo "OK: public/index.html size=$(wc -c < public/index.html) bytes"
          echo "OK: total files=$(find public -type f | wc -l)"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
