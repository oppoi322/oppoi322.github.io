<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>德州扑克（单人版）- 云爪的博客</title>
  <meta name="description" content="单人德州扑克：你对战多名不同风格的AI玩家（纯前端，无联机）。" />
  <link rel="stylesheet" href="./styles.css?v=20260323-fit" />
  <link rel="stylesheet" href="./mobile.css?v=20260323-outside-fit-5" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="title">德州扑克（单人版）</div>
        <div class="subtitle">你 vs 多个 AI（不同风格）。纯前端。本页不需要登录。</div>
      </div>
      <div class="top-actions">
        <button id="btnNewGame" class="btn btn-secondary">重置筹码</button>
      </div>
    </header>

    <main class="layout">
      <!-- Desktop layout (existing) -->
      <section class="table desktop-only" aria-label="poker table">
        <div class="table-inner">
          <div class="board">
            <div class="row">
              <div class="label">公共牌</div>
              <div id="communityCards" class="cards" aria-label="community cards"></div>
            </div>
            <div class="row meta">
              <div>阶段：<span id="street">-</span></div>
              <div>底池：<span id="pot">0</span></div>
              <div>当前下注：<span id="currentBet">0</span></div>
              <div>轮到：<span id="turn">-</span></div>
            </div>
          </div>

          <div id="seats" class="seats" aria-label="seats"></div>
        </div>
      </section>

      <aside class="panel desktop-only">
        <section class="you">
          <h2>你的手牌</h2>
          <div id="yourCards" class="cards"></div>
          <div class="stack">筹码：<span id="yourStack">0</span></div>
        </section>

        <section class="controls">
          <h2>操作</h2>
          <div class="control-row">
            <button id="btnFold" class="btn btn-danger">弃牌</button>
            <button id="btnCheckCall" class="btn">看牌 / 跟注</button>
          </div>

          <div class="raise">
            <div class="raise-head">
              <div>加注金额</div>
              <div class="hint">（最小加注会自动校验）</div>
            </div>
            <div class="raise-row">
              <input id="raiseAmount" type="number" inputmode="numeric" class="input" min="0" step="10" />
              <button id="btnRaise" class="btn btn-primary">加注</button>
            </div>
            <div class="quick">
              <button class="chip" data-quick="min">最小</button>
              <button class="chip" data-quick="halfpot">半池</button>
              <button class="chip" data-quick="pot">一池</button>
              <button class="chip" data-quick="allin">全下</button>
            </div>
          </div>

          <div class="note">
            说明：这是一个教学/娱乐性质的单人版本。AI 使用启发式策略 + 少量随机，不保证“最优”。
          </div>
        </section>

        <section class="log">
          <h2>日志</h2>
          <div id="log" class="log-box" role="log" aria-live="polite"></div>
        </section>
      </aside>

      <!-- Mobile layout: oval table + bottom action bar -->
      <section class="mobile-table mobile-only" aria-label="mobile poker table">
        <div class="oval">
          <div class="oval-inner">
            <div id="m-seat-0" class="m-seat"></div>
            <div id="m-seat-1" class="m-seat"></div>
            <div id="m-seat-2" class="m-seat"></div>
            <div id="m-seat-3" class="m-seat"></div>
            <div id="m-seat-4" class="m-seat"></div>
            <div id="m-seat-5" class="m-seat"></div>

            <div class="center">
              <div class="center-top">
                <div class="center-line">总注 <span id="m-pot">0</span></div>
              </div>
              <div id="m-community" class="cards" aria-label="community cards mobile"></div>
            </div>
          </div>
        </div>
      </section>

      <nav class="actionbar mobile-only" aria-label="actions">
        <button id="m-btnFold" class="btn btn-danger">弃牌</button>
        <button id="m-btnCheckCall" class="btn">看牌/跟注</button>
        <div class="m-raise-wrap">
          <button id="m-btnRaise" class="btn btn-primary">加注</button>
          <input id="m-raiseAmount" class="m-raise" type="number" inputmode="numeric" min="0" step="10" placeholder="金额" />
        </div>
      </nav>

      <div class="midbar mobile-only" aria-label="between-hands">
        <div class="mid-left">
          <span class="mid-label">中场时间</span>
          <select id="m-nextDelay" class="mid-select">
            <option value="2000">2秒</option>
            <option value="5000" selected>5秒</option>
            <option value="8000">8秒</option>
            <option value="10000">10秒</option>
            <option value="-1">手动下一局</option>
          </select>
          <span id="m-nextCountdown" class="mid-countdown"></span>
        </div>
        <button id="m-btnNextHand" class="btn">新的一局</button>
      </div>
    </main>

    <footer class="footer">
      <a href="/" class="link">返回博客首页</a>
      <span class="sep">·</span>
      <a href="/archives/" class="link">归档</a>
      <span class="sep">·</span>
      <a href="/categories/" class="link">分类</a>
    </footer>
  </div>

  <script src="./app.js?v=20260323-manual-option"></script>
</body>
</html>
