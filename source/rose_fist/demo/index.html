<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rose_fist Demo - 上传图片识别握拳并叠加玫瑰</title>
  <style>
    :root { --w: 920px; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; margin: 16px; color: #222; }
    .wrap { max-width: var(--w); margin: 0 auto; }
    h1 { font-size: 20px; margin: 8px 0 12px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; background: #fff; }
    .controls { flex: 1 1 280px; min-width: 280px; }
    .preview { flex: 2 1 560px; min-width: 320px; }
    label { display:block; font-size: 13px; color:#444; margin: 10px 0 4px; }
    input[type="number"] { width: 120px; }
    input[type="file"] { width: 100%; }
    button { padding: 8px 10px; border-radius: 8px; border: 1px solid #ccc; background: #f7f7f7; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    canvas { max-width: 100%; height: auto; border-radius: 10px; border: 1px solid #eee; background: #fafafa; }
    .small { font-size: 12px; color: #666; line-height: 1.45; }
    pre { white-space: pre-wrap; word-break: break-word; background: #0b1020; color: #e6e6e6; padding: 10px; border-radius: 10px; font-size: 12px; }
    .ok { color: #0a7; font-weight: 600; }
    .bad { color: #c33; font-weight: 600; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>rose_fist Demo：上传图片 → 识别“握拳” → 叠加玫瑰</h1>

  <div class="row">
    <div class="card controls">
      <label>上传图片（本地文件）</label>
      <input id="file" type="file" accept="image/*" />

      <label>弯曲角度阈值（PIP angle &lt; 阈值视为弯曲）</label>
      <input id="thr" type="number" value="160" min="60" max="179" step="1" />

      <label>至少几根手指弯曲才算握拳</label>
      <input id="need" type="number" value="3" min="1" max="4" step="1" />

      <div style="margin-top: 12px; display:flex; gap:10px; align-items:center; flex-wrap: wrap;">
        <button id="run" disabled>运行识别并叠加</button>
        <button id="download" disabled>下载结果 PNG</button>
      </div>

      <p class="small" style="margin-top: 10px;">
        说明：本 demo 完全在浏览器端运行（无后端）。首次运行会从 CDN 加载 MediaPipe 模型与 wasm，可能需要几秒。
      </p>

      <div id="status" class="small">状态：等待上传图片</div>
      <div id="result" class="small"></div>

      <label>调试信息</label>
      <pre id="debug">(empty)</pre>
    </div>

    <div class="card preview">
      <canvas id="cv"></canvas>
      <p class="small">提示：如果识别不到手，可以换更清晰的手势图片（光照足、手在画面中央、无遮挡）。</p>
    </div>
  </div>
</div>

<script type="module">
  import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

  const $ = (id) => document.getElementById(id);
  const fileEl = $("file");
  const runBtn = $("run");
  const dlBtn = $("download");
  const canvas = $("cv");
  const ctx = canvas.getContext("2d");
  const statusEl = $("status");
  const resultEl = $("result");
  const debugEl = $("debug");

  const ROSE_URL = "../assets/rose_twemoji.png";

  let inputImageBitmap = null;
  let roseImg = null;
  let handLandmarker = null;

  function setStatus(msg) {
    statusEl.textContent = `状态：${msg}`;
  }

  function setDebug(obj) {
    debugEl.textContent = typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
  }

  function dist(a, b) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    return Math.sqrt(dx*dx + dy*dy);
  }

  function angleDeg(a, b, c) {
    // angle ABC
    const bax = a.x - b.x;
    const bay = a.y - b.y;
    const bcx = c.x - b.x;
    const bcy = c.y - b.y;
    const dot = bax*bcx + bay*bcy;
    const denom = (Math.sqrt(bax*bax + bay*bay) * Math.sqrt(bcx*bcx + bcy*bcy)) + 1e-6;
    let cosv = dot / denom;
    cosv = Math.max(-1, Math.min(1, cosv));
    return Math.acos(cosv) * 180 / Math.PI;
  }

  function classifyFist(points, thr, need) {
    const fingers = {
      index: { mcp: 5, pip: 6, tip: 8 },
      middle:{ mcp: 9, pip:10, tip:12 },
      ring:  { mcp:13, pip:14, tip:16 },
      pinky: { mcp:17, pip:18, tip:20 },
    };
    const angles = {};
    const curled = {};
    let curledCount = 0;
    for (const [k, v] of Object.entries(fingers)) {
      const ang = angleDeg(points[v.mcp], points[v.pip], points[v.tip]);
      angles[k] = Math.round(ang * 10) / 10;
      curled[k] = ang < thr;
      if (curled[k]) curledCount++;
    }
    return {
      isFist: curledCount >= need,
      angles,
      curled,
      curledCount,
      thr,
      need,
    };
  }

  function palmPose(points, width, height) {
    // palm center approx = mean(wrist + MCPs)
    const idx = [0, 5, 9, 13, 17];
    let x = 0, y = 0;
    for (const i of idx) { x += points[i].x; y += points[i].y; }
    x /= idx.length; y /= idx.length;

    // bbox for size
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of points) {
      x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y);
      x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y);
    }
    const handSize = Math.max(x1 - x0, y1 - y0);
    const size = Math.max(32, Math.min(0.9 * handSize, 0.8 * Math.min(width, height)));

    // rotation from wrist->middle_mcp
    const wrist = points[0];
    const mid = points[9];
    const rot = Math.atan2(mid.y - wrist.y, mid.x - wrist.x) * 180 / Math.PI;

    return { cx: x, cy: y, size, rot };
  }

  async function ensureModels() {
    if (handLandmarker) return;

    setStatus("加载 MediaPipe wasm + hand_landmarker 模型...（首次较慢）");
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

    // official hosted model (CORS ok in general). If fails, user will see error.
    const modelUrl = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: modelUrl,
      },
      runningMode: "IMAGE",
      numHands: 1,
    });

    roseImg = new Image();
    roseImg.crossOrigin = "anonymous";
    roseImg.src = ROSE_URL;
    await roseImg.decode();

    setStatus("模型加载完成");
  }

  function drawBase() {
    canvas.width = inputImageBitmap.width;
    canvas.height = inputImageBitmap.height;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(inputImageBitmap, 0, 0);
  }

  async function runOnce() {
    if (!inputImageBitmap) return;

    runBtn.disabled = true;
    dlBtn.disabled = true;
    resultEl.textContent = "";
    setDebug("(running)");

    try {
      await ensureModels();
      setStatus("识别中...");

      drawBase();

      const det = handLandmarker.detect(inputImageBitmap);
      const landmarks = det.landmarks?.[0];
      if (!landmarks) {
        setStatus("未检测到手");
        resultEl.innerHTML = '<span class="bad">未检测到手</span>';
        setDebug(det);
        return;
      }

      // Convert normalized coords to pixel points
      const pts = landmarks.map((p) => ({ x: p.x * canvas.width, y: p.y * canvas.height }));

      const thr = Number($("thr").value);
      const need = Number($("need").value);
      const cls = classifyFist(pts, thr, need);

      // show info
      resultEl.innerHTML = cls.isFist
        ? '<span class="ok">判定：握拳（已叠加玫瑰）</span>'
        : '<span class="bad">判定：非握拳（不叠加玫瑰）</span>';

      if (cls.isFist) {
        const pose = palmPose(pts, canvas.width, canvas.height);

        // Draw rose with rotation about its center
        const scale = pose.size / Math.max(roseImg.width, roseImg.height);
        const w = roseImg.width * scale;
        const h = roseImg.height * scale;

        ctx.save();
        ctx.translate(pose.cx, pose.cy);
        ctx.rotate(pose.rot * Math.PI / 180);
        ctx.drawImage(roseImg, -w/2, -h/2, w, h);
        ctx.restore();
      }

      setStatus("完成");
      setDebug({
        fist: cls,
        handedness: det.handedness?.[0] ?? null,
      });

      dlBtn.disabled = false;
    } catch (e) {
      console.error(e);
      setStatus("失败：" + (e?.message || String(e)));
      resultEl.innerHTML = '<span class="bad">运行失败</span>';
      setDebug(String(e?.stack || e));
    } finally {
      runBtn.disabled = false;
    }
  }

  fileEl.addEventListener("change", async () => {
    const f = fileEl.files?.[0];
    if (!f) return;

    setStatus("读取图片...");
    inputImageBitmap = await createImageBitmap(f);
    drawBase();
    runBtn.disabled = false;
    dlBtn.disabled = true;
    resultEl.textContent = "";
    setDebug("(ready)");
    setStatus("已加载图片，点击“运行识别并叠加”");
  });

  runBtn.addEventListener("click", runOnce);

  dlBtn.addEventListener("click", () => {
    const a = document.createElement("a");
    a.download = "rose_fist_result.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  });
</script>
</body>
</html>
